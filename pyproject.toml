[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classificador-documentos-fiscais"
version = "0.1.0"
description = "Classificacao de documentos fiscais (NF-e / boleto) com NLP: TF-IDF + scikit-learn, extracao de texto com pdfminer.six."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kelvin Oliveira" }]
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.3.0",
    "pdfminer.six>=20241008",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
classificador-fiscais = "classificador_fiscais.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
